# Lädt die App bei jedem Push auf "main" per FTP auf den Netcup-Webspace.
# Benötigte Secrets (Repository → Settings → Secrets and variables → Actions):
#   FTP_SERVER    z. B. ftp.deinedomain.de (aus dem Netcup WCP)
#   FTP_USERNAME  FTP-Benutzer
#   FTP_PASSWORD  FTP-Passwort
#   FTP_DIR       Zielordner auf dem Webspace, z. B. /garage/  (mit Slash am Ende)
name: Deploy auf Netcup

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP-Syntax prüfen
        run: find . -name "*.php" -not -path "./.git/*" -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Prüfen, ob FTP-Zugang hinterlegt ist
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "Kein FTP_SERVER-Secret hinterlegt – Deploy übersprungen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Per FTP hochladen
        if: steps.check.outputs.skip != 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            data/**
            config.php
            README.md
            tools/**
            .idea/**
            .claude-account
