# Holt alle 4 Stunden Kilometerstand und Service-Intervalle aus MySkoda
# und schickt sie an die Garage-API.
# Benötigte Secrets: SKODA_USER, SKODA_PASSWORD, GARAGE_URL, GARAGE_TOKEN
name: MySkoda-Abgleich

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prüfen, ob Zugangsdaten hinterlegt sind
        id: check
        env:
          SKODA_USER: ${{ secrets.SKODA_USER }}
        run: |
          if [ -z "$SKODA_USER" ]; then
            echo "Keine MySkoda-Zugangsdaten hinterlegt – übersprungen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Abhängigkeiten installieren
        if: steps.check.outputs.skip != 'true'
        run: pip install -r tools/requirements.txt

      - name: Abgleich
        if: steps.check.outputs.skip != 'true'
        env:
          SKODA_USER: ${{ secrets.SKODA_USER }}
          SKODA_PASSWORD: ${{ secrets.SKODA_PASSWORD }}
          GARAGE_URL: ${{ secrets.GARAGE_URL }}
          GARAGE_TOKEN: ${{ secrets.GARAGE_TOKEN }}
        run: python tools/skoda_sync.py
